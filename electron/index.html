<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PC Media Remote</title>
  <style>
    :root {
      --bg-grad: radial-gradient(circle at 18% 12%, #1d2b4a 0%, #101726 48%, #0b0f19 100%);
      --card-bg: rgba(255, 255, 255, 0.045);
      --card-border: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(0, 0, 0, 0.28);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #3b82f6;
      --green: #4ade80;
      --green-bg: rgba(34, 197, 94, 0.14);
      --red: #f87171;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    ::-webkit-scrollbar {
      display: none;
    }

    body {
      margin: 0;
      padding: 16px 18px 14px;
      background: var(--bg-grad);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    .header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      flex-shrink: 0;
    }

    .title-wrap {
      text-align: center;
    }

    .title-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .app-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.45);
    }

    .app-badge svg {
      width: 11px;
      height: 11px;
      fill: #ffffff;
      margin-left: 1px;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .title-wrap p {
      margin: 2px 0 0;
      font-size: 0.74rem;
      color: var(--muted);
    }

    .status-pill {
      position: absolute;
      right: 0;
      top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 0.73rem;
      font-weight: 600;
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid rgba(74, 222, 128, 0.35);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* 2-Column Main Grid */
    .main-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
      backdrop-filter: blur(12px);
    }

    /* Left Column: Connection & Link */
    .left-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .card-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: #e4e4e7;
    }

    .qr-box {
      align-self: center;
      background: #ffffff;
      padding: 10px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 212px;
      height: 212px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .qr-box img {
      width: 192px;
      height: 192px;
      display: block;
    }

    .url-row {
      display: flex;
      gap: 7px;
      align-items: stretch;
    }

    .url-text {
      flex: 1;
      min-width: 0;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 0.74rem;
      line-height: 1.35;
      color: #e4e4e7;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      word-break: break-all;
      user-select: text;
    }

    .btn-copy-icon {
      width: 40px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-copy-icon svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mdns-wrap {
      font-size: 0.71rem;
      color: var(--muted);
      line-height: 1.35;
      user-select: text;
      word-break: break-all;
    }

    /* Right Column */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    .section-label {
      font-size: 0.69rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .pin-display {
      margin: 4px 0 8px;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.24em;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .pin-mode-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
      font-size: 0.76rem;
      color: #d4d4d8;
    }

    .pin-mode-row span.active {
      color: #ffffff;
      font-weight: 600;
    }

    .pin-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pin-input {
      flex: 1;
      min-width: 0;
      height: 33px;
      border-radius: 9px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: #fff;
      padding: 0 10px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      outline: none;
      user-select: text;
    }

    .pin-input:focus {
      border-color: var(--accent);
    }

    .pin-input:disabled {
      opacity: 0.45;
    }

    button {
      appearance: none;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      border-radius: 9px;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.08s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.13);
    }

    button:active {
      transform: scale(0.97);
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.25;
    }

    .switch {
      position: relative;
      width: 38px;
      height: 21px;
      display: inline-block;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 15px;
      height: 15px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .switch input:checked + .slider {
      background: #60a5fa;
    }

    .switch input:checked + .slider::before {
      transform: translateX(17px);
    }

    /* File Sharing */
    .file-stack {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 8px;
    }

    .btn-file {
      width: 100%;
      height: 33px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 0.78rem;
    }

    .btn-file svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .shared-chips {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      margin-top: 7px;
      overflow-x: auto;
    }

    .shared-chips:empty {
      display: none;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 7px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      font-size: 0.7rem;
      color: #e4e4e7;
      max-width: 150px;
      flex-shrink: 0;
    }

    .chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chip button {
      border: none;
      background: transparent;
      padding: 0 2px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1;
    }

    /* Activity */
    .log-card {
      flex: 1;
      min-height: 62px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .log-list {
      flex: 1;
      overflow-y: auto;
      font-size: 0.72rem;
      line-height: 1.35;
      color: #d4d4d8;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .log-item span {
      color: var(--muted);
      margin-right: 5px;
      font-variant-numeric: tabular-nums;
    }

    /* Footer */
    .footer {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      flex-shrink: 0;
    }

    .footer button {
      height: 36px;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(248, 113, 113, 0.45);
      color: #fca5a5;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.24);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="title-wrap">
      <div class="title-row">
        <span class="app-badge">
          <svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4" /></svg>
        </span>
        <h1>PC Media Remote</h1>
      </div>
      <p id="clientsText">0 phones connected</p>
    </div>
    <div class="status-pill">
      <span class="dot"></span>
      <span id="statusText">Running</span>
    </div>
  </header>

  <main class="main-grid">
    <!-- Left Column: QR & Connection -->
    <section class="card left-card">
      <div class="card-title">Connection &amp; Link</div>
      <div class="qr-box">
        <img id="qrImg" alt="Scan QR Code" />
      </div>
      <div class="url-row">
        <div id="urlText" class="url-text">Starting server...</div>
        <button type="button" id="copyBtn" class="btn-copy-icon" title="Copy URL">
          <svg viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
        </button>
      </div>
      <div class="mdns-wrap">
        Permanent link:<br />
        <span id="mdnsText">http://pcremote.local:3000</span>
      </div>
    </section>

    <!-- Right Column: PIN, Startup, File Sharing, Activity -->
    <div class="right-col">
      <section class="card">
        <div class="section-label">Session PIN</div>
        <div id="pinDisplay" class="pin-display">----</div>
        <div class="pin-mode-row">
          <span id="labelFixed" class="active">Fixed</span>
          <label class="switch">
            <input type="checkbox" id="pinModeToggle" />
            <span class="slider"></span>
          </label>
          <span id="labelRandom">Random</span>
        </div>
        <div class="pin-controls">
          <input id="fixedPinInput" class="pin-input" type="text" maxlength="4" inputmode="numeric" placeholder="4927" />
          <button type="button" id="applyPinBtn">Apply</button>
        </div>
      </section>

      <section class="card setting-row">
        <span>Start automatically with Windows</span>
        <label class="switch">
          <input type="checkbox" id="autoStartToggle" />
          <span class="slider"></span>
        </label>
      </section>

      <section class="card">
        <div class="section-label">File Sharing (Drag &amp; Drop or Pick)</div>
        <div class="file-stack">
          <button type="button" id="shareFilesBtn" class="btn-file">
            <svg viewBox="0 0 24 24">
              <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
              <line x1="12" y1="18" x2="12.01" y2="18" />
            </svg>
            Send to Phone
          </button>
          <button type="button" id="openDownloadsBtn" class="btn-file">
            <svg viewBox="0 0 24 24">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
            </svg>
            Open Folder
          </button>
        </div>
        <div id="sharedChips" class="shared-chips"></div>
      </section>

      <section class="card log-card">
        <div class="section-label">Activity</div>
        <div id="logList" class="log-list"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <button type="button" id="restartBtn">Restart</button>
    <button type="button" id="trayBtn">Hide to Tray</button>
    <button type="button" id="quitBtn" class="btn-danger">Quit</button>
  </footer>

  <script>
    (function () {
      const qrImg = document.getElementById('qrImg');
      const urlText = document.getElementById('urlText');
      const mdnsText = document.getElementById('mdnsText');
      const copyBtn = document.getElementById('copyBtn');
      const pinDisplay = document.getElementById('pinDisplay');
      const clientsText = document.getElementById('clientsText');
      const pinModeToggle = document.getElementById('pinModeToggle');
      const labelFixed = document.getElementById('labelFixed');
      const labelRandom = document.getElementById('labelRandom');
      const fixedPinInput = document.getElementById('fixedPinInput');
      const applyPinBtn = document.getElementById('applyPinBtn');
      const autoStartToggle = document.getElementById('autoStartToggle');
      const shareFilesBtn = document.getElementById('shareFilesBtn');
      const openDownloadsBtn = document.getElementById('openDownloadsBtn');
      const sharedChips = document.getElementById('sharedChips');
      const logList = document.getElementById('logList');
      const restartBtn = document.getElementById('restartBtn');
      const trayBtn = document.getElementById('trayBtn');
      const quitBtn = document.getElementById('quitBtn');

      let selectedMode = 'fixed';

      function syncPinModeUi(mode) {
        selectedMode = mode === 'random' ? 'random' : 'fixed';
        pinModeToggle.checked = selectedMode === 'random';
        labelFixed.classList.toggle('active', selectedMode === 'fixed');
        labelRandom.classList.toggle('active', selectedMode === 'random');
        fixedPinInput.disabled = selectedMode === 'random';
      }

      function render(state) {
        if (!state) return;
        if (state.qrDataUrl) qrImg.src = state.qrDataUrl;
        urlText.textContent = state.url || 'Starting...';
        mdnsText.textContent = state.mdnsUrl || '';
        pinDisplay.textContent = state.pin || '----';
        clientsText.textContent =
          state.connectedClients === 1
            ? '1 phone connected'
            : `${state.connectedClients || 0} phones connected`;

        syncPinModeUi(state.pinMode || 'fixed');
        if (document.activeElement !== fixedPinInput && state.fixedPin) {
          fixedPinInput.value = state.fixedPin;
        }
        autoStartToggle.checked = Boolean(state.autoStart);

        logList.innerHTML = (state.logs || [])
          .map((item) => `<div class="log-item"><span>${item.time}</span>${item.message}</div>`)
          .join('');

        sharedChips.innerHTML = '';
        (state.sharedFiles || []).forEach((f) => {
          const chip = document.createElement('div');
          chip.className = 'chip';
          const nameSpan = document.createElement('span');
          nameSpan.textContent = f.name;
          const rmBtn = document.createElement('button');
          rmBtn.type = 'button';
          rmBtn.textContent = '×';
          rmBtn.title = 'Stop sharing';
          rmBtn.addEventListener('click', async () => {
            const next = await window.pcRemote.unshareFile(f.id);
            render(next);
          });
          chip.appendChild(nameSpan);
          chip.appendChild(rmBtn);
          sharedChips.appendChild(chip);
        });
      }

      window.pcRemote.getState().then(render);
      window.pcRemote.onStateUpdate(render);

      pinModeToggle.addEventListener('change', () => {
        syncPinModeUi(pinModeToggle.checked ? 'random' : 'fixed');
      });

      applyPinBtn.addEventListener('click', async () => {
        const pin = fixedPinInput.value.trim();
        if (selectedMode === 'fixed' && !/^\d{4}$/.test(pin)) {
          fixedPinInput.focus();
          return;
        }
        const next = await window.pcRemote.savePinSettings({ pinMode: selectedMode, fixedPin: pin });
        render(next);
      });

      autoStartToggle.addEventListener('change', async () => {
        const next = await window.pcRemote.setAutoStart(autoStartToggle.checked);
        render(next);
      });

      copyBtn.addEventListener('click', async () => {
        await window.pcRemote.copyUrl();
        copyBtn.style.color = '#4ade80';
        setTimeout(() => { copyBtn.style.color = ''; }, 1200);
      });

      restartBtn.addEventListener('click', async () => {
        const next = await window.pcRemote.restartServer();
        render(next);
      });

      shareFilesBtn.addEventListener('click', async () => {
        const next = await window.pcRemote.pickFilesToShare();
        render(next);
      });

      openDownloadsBtn.addEventListener('click', () => {
        window.pcRemote.openDownloadsFolder();
      });

      document.body.addEventListener('dragover', (e) => {
        e.preventDefault();
      });

      document.body.addEventListener('drop', async (e) => {
        e.preventDefault();
        const paths = Array.from(e.dataTransfer?.files || [])
          .map((f) => f.path)
          .filter(Boolean);
        if (paths.length > 0) {
          const next = await window.pcRemote.sharePaths(paths);
          render(next);
        }
      });

      trayBtn.addEventListener('click', () => window.pcRemote.hideToTray());
      quitBtn.addEventListener('click', () => window.pcRemote.quitApp());
    })();
  </script>
</body>
</html>
